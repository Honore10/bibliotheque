<div class="bg-white shadow-xl rounded-2xl border border-gray-100 overflow-hidden sticky top-24 max-h-[calc(100vh-7rem)] flex flex-col">
    <!-- Header with gradient (fixed part) -->
    <div class="relative p-6 bg-gradient-to-br from-rose-600 via-rose-700 to-pink-700 text-white overflow-hidden flex-shrink-0">
        <div class="absolute top-0 right-0 opacity-10 transform translate-x-4 -translate-y-4">
            <i class="fas fa-crown fa-5x"></i>
        </div>
        <div class="relative z-10 flex items-center gap-4">
            <div class="w-14 h-14 bg-white/20 backdrop-blur rounded-xl flex items-center justify-center shadow-lg">
                <i class="fas fa-user-cog text-2xl"></i>
            </div>
            <div>
                <h2 class="font-bold text-lg">{{ request.user.username|default:"Admin" }}</h2>
                <p class="text-xs text-rose-200 font-medium uppercase tracking-wider">Administrateur</p>
            </div>
        </div>
    </div>
    
    <!-- Scrollable Navigation -->
    <nav class="p-3 space-y-1 overflow-y-auto flex-grow custom-scrollbar">
        <a href="{% url 'admin_dashboard' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'dashboard' %}bg-rose-600 text-white shadow-md{% else %}text-gray-600 hover:bg-rose-50 hover:text-rose-700{% endif %}">
           <i class="fas fa-tachometer-alt w-6 text-center mr-3 {% if active == 'dashboard' %}text-rose-200{% else %}text-gray-400 group-hover:text-rose-600{% endif %} transition"></i> Tableau de bord
        </a>
        
        <div class="pt-2 pb-1 px-4">
           <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Gestion</span>
        </div>
        
        <a href="{% url 'admin_personnel_list' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'personnel' %}bg-rose-600 text-white shadow-md{% else %}text-gray-600 hover:bg-rose-50 hover:text-rose-700{% endif %}">
           <i class="fas fa-user-tie w-6 text-center mr-3 {% if active == 'personnel' %}text-rose-200{% else %}text-gray-400 group-hover:text-rose-600{% endif %} transition"></i> Personnel
        </a>
        <a href="{% url 'admin_types_membres_list' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'types_membres' %}bg-rose-600 text-white shadow-md{% else %}text-gray-600 hover:bg-rose-50 hover:text-rose-700{% endif %}">
           <i class="fas fa-id-card w-6 text-center mr-3 {% if active == 'types_membres' %}text-rose-200{% else %}text-gray-400 group-hover:text-rose-600{% endif %} transition"></i> Types de Membres
        </a>
        
        <div class="pt-2 pb-1 px-4">
           <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Analyses</span>
        </div>
        
        <a href="{% url 'admin_statistiques' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'statistiques' %}bg-rose-600 text-white shadow-md{% else %}text-gray-600 hover:bg-rose-50 hover:text-rose-700{% endif %}">
           <i class="fas fa-chart-bar w-6 text-center mr-3 {% if active == 'statistiques' %}text-rose-200{% else %}text-gray-400 group-hover:text-rose-600{% endif %} transition"></i> Statistiques
        </a>
    </nav>
    
    <!-- Footer Links -->
    <div class="p-4 border-t border-gray-100 space-y-1">
        <a href="{% url 'staff_dashboard' %}" class="group flex items-center px-4 py-2.5 rounded-xl transition-all duration-200 text-gray-600 hover:bg-indigo-50 hover:text-indigo-700 text-sm">
           <i class="fas fa-user-shield w-5 text-center mr-3 text-gray-400 group-hover:text-indigo-600 transition"></i> Espace Staff
        </a>
        <a href="{% url 'home' %}" class="group flex items-center px-4 py-2.5 rounded-xl transition-all duration-200 text-gray-600 hover:bg-green-50 hover:text-green-700 text-sm">
           <i class="fas fa-book w-5 text-center mr-3 text-gray-400 group-hover:text-green-600 transition"></i> Voir le catalogue
        </a>
        <a href="{% url 'logout' %}" class="group flex items-center px-4 py-2.5 rounded-xl transition-all duration-200 text-gray-600 hover:bg-red-50 hover:text-red-700 text-sm">
           <i class="fas fa-sign-out-alt w-5 text-center mr-3 text-gray-400 group-hover:text-red-600 transition"></i> Déconnexion
        </a>
    </div>
</div>
