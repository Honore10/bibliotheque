<div class="bg-white shadow-xl rounded-2xl border border-green-100 sticky top-24 max-h-[calc(100vh-7rem)] flex flex-col overflow-hidden">
     <!-- Decorative background pattern behind avatar (fixed part) avec gradient multicolore -->
     <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-r from-green-500 via-teal-500 to-emerald-500"></div>
     
     <div class="p-6 text-center relative flex-shrink-0">
         <div class="relative w-24 h-24 mx-auto bg-white rounded-full flex items-center justify-center p-1 mb-4 shadow-lg ring-4 ring-green-50 mt-8">
             <div class="w-full h-full rounded-full bg-gradient-to-br from-green-400 to-teal-500 flex items-center justify-center text-white text-3xl">
                 <i class="fas fa-user"></i>
             </div>
         </div>
         
         <h2 class="font-bold text-gray-900 truncate text-lg">{{ request.user.username }}</h2>
         <p class="text-xs font-semibold bg-gradient-to-r from-green-600 to-teal-600 bg-clip-text text-transparent uppercase tracking-widest mb-4">Espace Membre</p>
     </div>
     
     <!-- Scrollable Navigation avec couleurs variées -->
     <nav class="px-4 pb-4 space-y-1 text-sm font-medium overflow-y-auto flex-grow custom-scrollbar">
         <a href="{% url 'membre_dashboard' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'dashboard' %}bg-gradient-to-r from-green-500 to-teal-500 text-white shadow-md{% else %}text-gray-600 hover:bg-green-50 hover:text-green-700{% endif %}">
            <i class="fas fa-columns w-6 text-center mr-3 {% if active == 'dashboard' %}text-green-200{% else %}text-gray-400 group-hover:text-green-600{% endif %} transition"></i> Vue d'ensemble
         </a>
         <a href="{% url 'membre_emprunts' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'emprunts' %}bg-gradient-to-r from-teal-500 to-cyan-500 text-white shadow-md{% else %}text-gray-600 hover:bg-teal-50 hover:text-teal-700{% endif %}">
            <i class="fas fa-book-reader w-6 text-center mr-3 {% if active == 'emprunts' %}text-teal-200{% else %}text-gray-400 group-hover:text-teal-600{% endif %} transition"></i> Mes emprunts
         </a>
         <a href="{% url 'membre_historique' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'historique' %}bg-gradient-to-r from-cyan-500 to-blue-500 text-white shadow-md{% else %}text-gray-600 hover:bg-cyan-50 hover:text-cyan-700{% endif %}">
            <i class="fas fa-history w-6 text-center mr-3 {% if active == 'historique' %}text-cyan-200{% else %}text-gray-400 group-hover:text-cyan-600{% endif %} transition"></i> Historique
         </a>
         <a href="{% url 'membre_reservations' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'reservations' %}bg-gradient-to-r from-blue-500 to-indigo-500 text-white shadow-md{% else %}text-gray-600 hover:bg-blue-50 hover:text-blue-700{% endif %}">
            <i class="fas fa-clock w-6 text-center mr-3 {% if active == 'reservations' %}text-blue-200{% else %}text-gray-400 group-hover:text-blue-600{% endif %} transition"></i> Réservations
         </a>
         <a href="{% url 'membre_favoris' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'favoris' %}bg-gradient-to-r from-indigo-500 to-purple-500 text-white shadow-md{% else %}text-gray-600 hover:bg-indigo-50 hover:text-indigo-700{% endif %}">
            <i class="fas fa-heart w-6 text-center mr-3 {% if active == 'favoris' %}text-indigo-200{% else %}text-gray-400 group-hover:text-indigo-600{% endif %} transition"></i> Favoris
         </a>
         <a href="{% url 'membre_recommandations' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'recommandations' %}bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-md{% else %}text-gray-600 hover:bg-purple-50 hover:text-purple-700{% endif %}">
            <i class="fas fa-magic w-6 text-center mr-3 {% if active == 'recommandations' %}text-purple-200{% else %}text-gray-400 group-hover:text-purple-600{% endif %} transition"></i> Recommandations
         </a>
         
         <div class="pt-2 pb-1 px-2">
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Communication</span>
         </div>
         
         <a href="{% url 'membre_notifications' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'notifications' %}bg-gradient-to-r from-pink-500 to-rose-500 text-white shadow-md{% else %}text-gray-600 hover:bg-pink-50 hover:text-pink-700{% endif %}">
            <i class="fas fa-bell w-6 text-center mr-3 {% if active == 'notifications' %}text-pink-200{% else %}text-gray-400 group-hover:text-pink-600{% endif %} transition"></i> Notifications
         </a>
         <a href="{% url 'membre_messages' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'messages' %}bg-gradient-to-r from-rose-500 to-red-500 text-white shadow-md{% else %}text-gray-600 hover:bg-rose-50 hover:text-rose-700{% endif %}">
            <i class="fas fa-envelope w-6 text-center mr-3 {% if active == 'messages' %}text-rose-200{% else %}text-gray-400 group-hover:text-rose-600{% endif %} transition"></i> Messages
         </a>
         <a href="{% url 'membre_sanctions' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'sanctions' %}bg-gradient-to-r from-red-500 to-orange-500 text-white shadow-md{% else %}text-gray-600 hover:bg-red-50 hover:text-red-700{% endif %}">
            <i class="fas fa-gavel w-6 text-center mr-3 {% if active == 'sanctions' %}text-red-200{% else %}text-gray-400 group-hover:text-red-600{% endif %} transition"></i> Sanctions
         </a>
     </nav>
     
     <!-- Footer Links avec couleurs variées -->
     <div class="p-4 border-t border-green-100 space-y-1 flex-shrink-0">
         <a href="{% url 'home' %}" class="group flex items-center px-4 py-2.5 rounded-xl transition-all duration-200 text-gray-600 hover:bg-teal-50 hover:text-teal-700 text-sm">
            <i class="fas fa-book w-5 text-center mr-3 text-gray-400 group-hover:text-teal-600 transition"></i> Catalogue
         </a>
         <a href="{% url 'logout' %}" class="group flex items-center px-4 py-2.5 rounded-xl transition-all duration-200 text-gray-600 hover:bg-red-50 hover:text-red-700 text-sm">
            <i class="fas fa-sign-out-alt w-5 text-center mr-3 text-gray-400 group-hover:text-red-600 transition"></i> Déconnexion
         </a>
     </div>
</div>
