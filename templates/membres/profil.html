{% extends "base_minimal.html" %}
{% block title %}Mon Profil{% endblock %}
{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
    <aside class="lg:col-span-4">
        {% include "membres/_sidebar.html" with active="profil" %}
    </aside>

    <section class="lg:col-span-8 space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-900">Mon Profil</h1>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 p-8 text-white text-center">
                <div class="w-24 h-24 mx-auto bg-white/20 rounded-full flex items-center justify-center mb-4">
                    <i class="fas fa-user text-4xl"></i>
                </div>
                <h2 class="text-xl font-bold">{{ profile.prenom }} {{ profile.nom }}</h2>
                <p class="text-indigo-200">{{ profile.email }}</p>
            </div>
            
            <form method="post" class="p-6 space-y-6">
                {% csrf_token %}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
                        <input type="tel" name="telephone" value="{{ profile.telephone|default:'' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
                        <input type="text" name="adresse" value="{{ profile.adresse|default:'' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nouveau mot de passe (optionnel)</label>
                    <input type="password" name="new_password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Laissez vide pour ne pas changer">
                </div>
                
                <div class="flex justify-end">
                    <button type="submit" class="px-6 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium">
                        <i class="fas fa-save mr-2"></i>Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </section>
</div>
{% endblock %}
