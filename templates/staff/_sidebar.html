<div class="bg-white shadow-xl rounded-2xl border border-blue-100 overflow-hidden sticky top-24 max-h-[calc(100vh-7rem)] flex flex-col">
     <!-- Header with gradient multicolore (fixed part) -->
     <div class="relative p-6 bg-gradient-to-br from-blue-500 via-cyan-500 to-teal-500 text-white overflow-hidden flex-shrink-0">
         <div class="absolute top-0 right-0 opacity-10 transform translate-x-4 -translate-y-4">
             <i class="fas fa-shield-alt fa-5x"></i>
         </div>
         <div class="relative z-10 flex items-center gap-4">
             <div class="w-14 h-14 bg-white/20 backdrop-blur rounded-xl flex items-center justify-center shadow-lg">
                 <i class="fas fa-user-shield text-2xl"></i>
             </div>
             <div>
                 <h2 class="font-bold text-lg">{{ request.user.username|default:"Staff" }}</h2>
                 <p class="text-xs text-blue-200 font-medium uppercase tracking-wider">Bibliothécaire</p>
             </div>
         </div>
     </div>
     
     <!-- Scrollable Navigation avec couleurs variées -->
     <nav class="p-3 space-y-1 overflow-y-auto flex-grow custom-scrollbar">
         <a href="{% url 'staff_dashboard' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'dashboard' %}bg-gradient-to-r from-blue-500 to-cyan-500 text-white shadow-md{% else %}text-gray-600 hover:bg-blue-50 hover:text-blue-700{% endif %}">
            <i class="fas fa-chart-pie w-6 text-center mr-3 {% if active == 'dashboard' %}text-blue-200{% else %}text-gray-400 group-hover:text-blue-600{% endif %} transition"></i> Tableau de bord
         </a>
         
         <div class="pt-2 pb-1 px-4">
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Gestion</span>
         </div>
         
         <a href="{% url 'staff_books_list' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'livres' %}bg-gradient-to-r from-cyan-500 to-teal-500 text-white shadow-md{% else %}text-gray-600 hover:bg-cyan-50 hover:text-cyan-700{% endif %}">
            <i class="fas fa-book w-6 text-center mr-3 {% if active == 'livres' %}text-cyan-200{% else %}text-gray-400 group-hover:text-cyan-600{% endif %} transition"></i> Livres
         </a>
         <a href="{% url 'staff_exemplaires_list' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'exemplaires' %}bg-gradient-to-r from-teal-500 to-green-500 text-white shadow-md{% else %}text-gray-600 hover:bg-teal-50 hover:text-teal-700{% endif %}">
            <i class="fas fa-copy w-6 text-center mr-3 {% if active == 'exemplaires' %}text-teal-200{% else %}text-gray-400 group-hover:text-teal-600{% endif %} transition"></i> Exemplaires
         </a>
         <a href="{% url 'staff_members_list' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'membres' %}bg-gradient-to-r from-green-500 to-emerald-500 text-white shadow-md{% else %}text-gray-600 hover:bg-green-50 hover:text-green-700{% endif %}">
            <i class="fas fa-users w-6 text-center mr-3 {% if active == 'membres' %}text-green-200{% else %}text-gray-400 group-hover:text-green-600{% endif %} transition"></i> Membres
         </a>
         <a href="{% url 'staff_categories_list' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'categories' %}bg-gradient-to-r from-emerald-500 to-lime-500 text-white shadow-md{% else %}text-gray-600 hover:bg-emerald-50 hover:text-emerald-700{% endif %}">
            <i class="fas fa-tags w-6 text-center mr-3 {% if active == 'categories' %}text-emerald-200{% else %}text-gray-400 group-hover:text-emerald-600{% endif %} transition"></i> Catégories
         </a>
         <a href="{% url 'staff_auteurs_list' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'auteurs' %}bg-gradient-to-r from-lime-500 to-yellow-500 text-white shadow-md{% else %}text-gray-600 hover:bg-lime-50 hover:text-lime-700{% endif %}">
            <i class="fas fa-pen-nib w-6 text-center mr-3 {% if active == 'auteurs' %}text-lime-200{% else %}text-gray-400 group-hover:text-lime-600{% endif %} transition"></i> Auteurs
         </a>
         
         <div class="pt-2 pb-1 px-4">
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Transactions</span>
         </div>
         
         <a href="{% url 'staff_emprunts_list' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'emprunts' %}bg-gradient-to-r from-yellow-500 to-amber-500 text-white shadow-md{% else %}text-gray-600 hover:bg-yellow-50 hover:text-yellow-700{% endif %}">
            <i class="fas fa-hand-holding-heart w-6 text-center mr-3 {% if active == 'emprunts' %}text-yellow-200{% else %}text-gray-400 group-hover:text-yellow-600{% endif %} transition"></i> Emprunts
         </a>
         <a href="{% url 'staff_reservations_list' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'reservations' %}bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-md{% else %}text-gray-600 hover:bg-amber-50 hover:text-amber-700{% endif %}">
            <i class="fas fa-clock w-6 text-center mr-3 {% if active == 'reservations' %}text-amber-200{% else %}text-gray-400 group-hover:text-amber-600{% endif %} transition"></i> Réservations
         </a>
         
         <div class="pt-2 pb-1 px-4">
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Suivi</span>
         </div>
         
         <a href="{% url 'staff_sanctions_list' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'sanctions' %}bg-gradient-to-r from-orange-500 to-red-500 text-white shadow-md{% else %}text-gray-600 hover:bg-orange-50 hover:text-orange-700{% endif %}">
            <i class="fas fa-gavel w-6 text-center mr-3 {% if active == 'sanctions' %}text-orange-200{% else %}text-gray-400 group-hover:text-orange-600{% endif %} transition"></i> Sanctions
         </a>
         <a href="{% url 'staff_messages_list' %}" class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 {% if active == 'messages' %}bg-gradient-to-r from-red-500 to-pink-500 text-white shadow-md{% else %}text-gray-600 hover:bg-red-50 hover:text-red-700{% endif %}">
            <i class="fas fa-envelope w-6 text-center mr-3 {% if active == 'messages' %}text-red-200{% else %}text-gray-400 group-hover:text-red-600{% endif %} transition"></i> Messages
         </a>
     </nav>
     
     <!-- Footer Links avec couleurs variées -->
     <div class="p-4 border-t border-blue-100 space-y-1">
         <a href="{% url 'home' %}" class="group flex items-center px-4 py-2.5 rounded-xl transition-all duration-200 text-gray-600 hover:bg-purple-50 hover:text-purple-700 text-sm">
            <i class="fas fa-book w-5 text-center mr-3 text-gray-400 group-hover:text-purple-600 transition"></i> Voir le catalogue
         </a>
         <a href="{% url 'logout' %}" class="group flex items-center px-4 py-2.5 rounded-xl transition-all duration-200 text-gray-600 hover:bg-red-50 hover:text-red-700 text-sm">
            <i class="fas fa-sign-out-alt w-5 text-center mr-3 text-gray-400 group-hover:text-red-600 transition"></i> Déconnexion
         </a>
     </div>
</div>
